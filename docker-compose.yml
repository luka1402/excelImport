name: excelimporter

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Postavite MSSQL_SA_PASSWORD u .env (vidi .env.example)}
    ports:
      - "${MSSQL_PORT:-14333}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Postavite MSSQL_SA_PASSWORD u .env (vidi .env.example)}
      DEMO_APP_LOGIN: ${DEMO_APP_LOGIN:-demo_importer}
      DEMO_APP_PASSWORD: ${DEMO_APP_PASSWORD:-}
    volumes:
      - ./db/init:/init:ro
    entrypoint: ["/bin/bash", "/init/run-init.sh"]
    restart: "no"

volumes:
  mssql-data:
